<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#131313">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="style.css">
<title>Gamble - Try not to Handle</title>
</head>
<body>

<header>
  <h1>Gamble <span class="sub-accent">Try not to Handle</span></h1>
  <button class="icon" id="themeToggle" title="Toggle theme">◐</button>
</header>

<div class="tray-wrap">
  <canvas id="scene"></canvas>
  <p class="loading" id="loadingMsg">Loading dice model…</p>
  <p class="hint-banner" id="hintBanner" style="display:none;"></p>
</div>

<button id="throwBtn" disabled>Throw</button>

<div class="card">
  <div class="row-label">Number of dice</div>
  <div class="stepper" id="diceCountStepper">
    <button type="button" class="count-btn active" data-count="1">1</button>
    <button type="button" class="count-btn" data-count="2">2</button>
    <button type="button" class="count-btn" data-count="3">3</button>
    <button type="button" class="count-btn" data-count="4">4</button>
    <button type="button" class="count-btn" data-count="5">5</button>
  </div>
</div>

<div class="card result-card" id="resultCard" style="display:none;">
  <div class="row-label">Result</div>
  <div class="dice-values" id="diceValues"></div>
  <div class="sum" id="diceSum"></div>
</div>

<div class="card">
  <div class="row-label">Roll speed</div>
  <div class="segment" id="speedToggle">
    <button type="button" class="seg-btn" data-speed="slow">Slow</button>
    <button type="button" class="seg-btn active" data-speed="normal">Normal</button>
    <button type="button" class="seg-btn" data-speed="fast">Fast</button>
  </div>
</div>

<div class="card">
  <div class="toggle-row">
    <label for="instantThrowToggle">Instant roll (no animation)</label>
    <input type="checkbox" id="instantThrowToggle">
  </div>
  <div class="toggle-row">
    <label for="cameraAnimToggle">Camera moves over dice after roll</label>
    <input type="checkbox" id="cameraAnimToggle" checked>
  </div>
</div>

<div class="card">
  <div class="row-label">Dice type</div>
  <div class="segment" id="dieTypeToggle">
    <button type="button" class="seg-btn active" data-type="d6">D6</button>
  </div>
  <p class="hint">More dice types (D4, D10, D12, D20, D50, D100, coin) are coming later.</p>
</div>

<div class="card">
  <div class="row-label">Pip mode</div>
  <div class="segment" id="pipModeToggle">
    <button type="button" class="seg-btn active" data-mode="6">1–6</button>
    <button type="button" class="seg-btn" data-mode="3">1–3 (doubled)</button>
  </div>
  <p class="hint" id="pipModeHint">Standard die: each number 1–6 appears once.</p>
</div>

<div class="card">
  <button type="button" class="collapse-toggle" id="statsToggle">
    <span>Statistics</span>
    <span class="chev" id="statsChev">▾</span>
  </button>
  <div class="stats-body" id="statsBody" style="display:none;">
    <p class="hint" id="statsSummary">No rolls yet.</p>
    <div class="stats-bars" id="statsBars"></div>
    <button type="button" id="statsResetBtn" class="ghost-btn">Reset statistics</button>
  </div>
</div>

<div class="card placeholder-card">
  <div class="placeholder-row">
    <span>Players</span>
    <span class="badge">coming soon</span>
  </div>
</div>

<footer>Gamble - Try not to Handle · v0.3.0</footer>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js"
  }
}
</script>
<script type="module" src="app.js"></script>
</body>
</html>
